name: Build ChangeOS Launcher

on:
  workflow_dispatch:
  workflow_call:
  push:
    branches: [main]
    paths: ["apps/launcher/**", ".github/workflows/launcher.yml"]

jobs:
  launcher:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.11.1" }
      - name: Build release APK
        run: gradle -p apps/launcher assembleRelease --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: changeos-launcher
          path: apps/launcher/app/build/outputs/apk/release/app-release.apk
